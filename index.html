<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة زفاف إسحق وإيرينى</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #fdfbf7 0%, #eef2f5 100%);
            font-family: 'Amiri', serif;
            color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
            overflow-x: hidden;
        }

        /* 1. شاشة الصورة في البداية */
        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 1;
            transition: opacity 1.5s ease;
        }

        #intro-screen img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* زرار التحكم في الصوت */
        .music-btn {
            position: fixed;
            bottom: 25px;
            z-index: 10000;
            background: #ffffff;
            color: #b8860b;
            border: 1px solid #d4af37;
            padding: 10px 20px;
            border-radius: 25px;
            font-family: 'Reem Kufi', sans-serif;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .music-btn:active {
            transform: scale(0.95);
        }

        /* 2. كارت الدعوة الرئيسي - ديزاين فاتح ورقيق */
        .card {
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #e6cb7a;
            border-radius: 24px;
            padding: 40px 24px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(184, 134, 11, 0.12);
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 1.5s ease, transform 1.5s ease;
            position: relative;
        }

        .card.show {
            opacity: 1;
            transform: scale(1);
        }

        .title {
            font-family: 'Reem Kufi', sans-serif;
            color: #b8860b;
            font-size: 2.2rem;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 24px;
        }

        .names {
            font-family: 'Reem Kufi', sans-serif;
            font-size: 2.4rem;
            font-weight: 700;
            margin: 15px 0;
            color: #2c3e50;
        }

        .names span {
            color: #d4af37;
            padding: 0 8px;
        }

        .details-box {
            border: 1px dashed #d4af37;
            background: #fffdf9;
            border-radius: 16px;
            padding: 20px;
            margin: 25px 0;
            line-height: 2;
            font-size: 1.15rem;
            box-shadow: inset 0 0 10px rgba(212, 175, 55, 0.05);
        }

        .details-box p {
            margin: 6px 0;
            color: #444;
        }

        .details-box strong {
            color: #b8860b;
        }

        .countdown-title {
            font-size: 1rem;
            color: #777;
            margin-bottom: 16px;
        }

        .countdown-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .time-box {
            border: 1px solid #eadca6;
            background: #ffffff;
            border-radius: 12px;
            padding: 12px 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }

        .time-box .number {
            font-size: 1.4rem;
            font-weight: bold;
            color: #b8860b;
            display: block;
        }

        .time-box .label {
            font-size: 0.8rem;
            color: #888;
            margin-top: 4px;
            display: block;
        }
    </style>
</head>
<body>

    <!-- ملف الموسيقى -->
    <audio id="bg-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <!-- زرار التحكم بالصوت -->
    <button class="music-btn" id="music-toggle" onclick="toggleMusic()">
        🎵 تشغيل الموسيقى
    </button>

    <!-- شاشة الصورة (5 ثواني) -->
    <div id="intro-screen">
        <img src="52bf4d92-04d8-47d0-860c-c82991e1cb71.jpeg" alt="صورة العروسين">
    </div>

    <!-- كارت الدعوة الفاتح -->
    <div class="card" id="main-card">
        <h1 class="title">دعوة زفاف</h1>
        <p class="subtitle">يتشرفان بدعوتكم لحضور حفل الزفاف المبارك</p>
        
        <div class="names">
            إسحق <span>&</span> إيرينى
        </div>

        <div class="details-box">
            <p>⛪ <strong>الإكليل المقدس:</strong> كنيسة الملاك والبابا كيرلس</p>
            <p>👑 <strong>الحفل:</strong> قاعة رويال بملوي</p>
            <p>📅 <strong>التاريخ:</strong> الثلاثاء ٨ سبتمبر ٢٠٢٦</p>
        </div>

        <div class="countdown-title">المتبقي على اليوم الموعود</div>

        <div class="countdown-container">
            <div class="time-box">
                <span class="number" id="seconds">00</span>
                <span class="label">ثانية</span>
            </div>
            <div class="time-box">
                <span class="number" id="minutes">00</span>
                <span class="label">دقيقة</span>
            </div>
            <div class="time-box">
                <span class="number" id="hours">00</span>
                <span class="label">ساعة</span>
            </div>
            <div class="time-box">
                <span class="number" id="days">00</span>
                <span class="label">يوم</span>
            </div>
        </div>
    </div>

    <script>
        const audio = document.getElementById('bg-music');
        const musicBtn = document.getElementById('music-toggle');

        function toggleMusic() {
            if (audio.paused) {
                audio.play();
                musicBtn.innerHTML = "🔊 كتم الصوت";
            } else {
                audio.pause();
                musicBtn.innerHTML = "🎵 تشغيل الموسيقى";
            }
        }

        document.body.addEventListener('click', function() {
            if (audio.paused) {
                audio.play();
                musicBtn.innerHTML = "🔊 كتم الصوت";
            }
        }, { once: true });

        // اختفاء الصورة وظهور كارت الدعوة
        setTimeout(function() {
            const intro = document.getElementById('intro-screen');
            const card = document.getElementById('main-card');

            intro.style.opacity = '0';

            setTimeout(function() {
                intro.style.display = 'none';
                card.classList.add('show');
            }, 1500);

        }, 5000);

        // العداد التنازلي
        const weddingDate = new Date("September 8, 2026 18:00:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = weddingDate - now;

            if (difference > 0) {
                const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((difference % (1000 * 60)) / 1000);

                document.getElementById("days").innerText = days;
                document.getElementById("hours").innerText = hours;
                document.getElementById("minutes").innerText = minutes;
                document.getElementById("seconds").innerText = seconds;
            } else {
                document.querySelector(".countdown-title").innerText = "ألف مبروك للعروسين!";
                document.querySelector(".countdown-container").style.display = "none";
            }
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
