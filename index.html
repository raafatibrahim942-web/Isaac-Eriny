<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isaac & Eriny Wedding</title>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Montserrat:wght@300;400;600&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #ffffff;
            font-family: 'Montserrat', sans-serif;
            color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
            overflow-x: hidden;
            text-align: center;
        }

        /* 1. الشاشة الأولى: الغلاف الذهبي */
        #cover-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #fdfbf7;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            opacity: 1;
            transition: opacity 1s ease;
        }

        .cover-frame {
            width: 88%;
            max-width: 380px;
            height: 75vh;
            border: 2px solid #d4af37;
            border-radius: 20px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #ffffff;
            box-shadow: inset 0 0 15px rgba(212, 175, 55, 0.1), 0 10px 30px rgba(0,0,0,0.05);
        }

        .cover-title {
            font-size: 3.5rem;
            color: #4a6b5d;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
        }

        /* 2. الشاشة الثانية: تصميم الورود والأصداف بنفس ستايل الصورة */
        #floral-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fffdfc;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            transition: opacity 1s ease;
            overflow: hidden;
        }

        /* زهور وأصداف مزخرفة منتشرة على الشاشة */
        .floral-element {
            position: absolute;
            font-size: 2.2rem;
            opacity: 0.85;
            filter: drop-shadow(0 4px 8px rgba(218, 148, 148, 0.15));
        }
        .f-top-left-1 { top: 12%; left: 18%; font-size: 3rem; transform: rotate(-15deg); }
        .f-top-left-2 { top: 20%; left: 10%; font-size: 2rem; }
        .f-top-right { top: 10%; right: 15%; font-size: 3.2rem; }
        .f-mid-left { top: 48%; left: 8%; font-size: 2.8rem; }
        .f-mid-right-1 { top: 38%; right: 12%; font-size: 2.5rem; }
        .f-mid-right-2 { top: 32%; right: 28%; font-size: 2rem; }
        .f-bottom-left { bottom: 18%; left: 12%; font-size: 3rem; }
        .f-bottom-right-1 { bottom: 12%; right: 14%; font-size: 3.2rem; }
        .f-bottom-right-2 { bottom: 22%; right: 22%; font-size: 2.2rem; }

        .floral-content {
            position: relative;
            z-index: 2;
        }

        .floral-names {
            font-family: 'Alex Brush', cursive;
            font-size: 3.6rem;
            color: #c47b62; /* وردي خشبي ناعم بنفس درجة الصورة */
            margin-bottom: 8px;
            font-weight: 500;
            line-height: 1.2;
        }

        .floral-subtitle {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 5px;
            color: #7a6b66;
            text-transform: uppercase;
            font-weight: 400;
            margin-bottom: 12px;
        }

        .floral-line {
            width: 140px;
            height: 1px;
            background-color: #c47b62;
            margin: 0 auto;
            opacity: 0.6;
        }

        /* 3. الشاشة الثالثة: صورة العروسين */
        #photo-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9998;
            opacity: 0;
            transition: opacity 1s ease;
        }

        #photo-screen img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* زرار التحكم بالصوت */
        .music-btn {
            position: fixed;
            bottom: 25px;
            z-index: 10001;
            background: #ffffff;
            color: #c47b62;
            border: 1px solid #e2b3a3;
            padding: 10px 20px;
            border-radius: 25px;
            font-family: 'Cairo', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        /* 4. كارت الدعوة الرئيسي */
        .card {
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #e6cb7a;
            border-radius: 24px;
            padding: 40px 24px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(184, 134, 11, 0.12);
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 1s ease, transform 1s ease;
        }

        .card.show {
            opacity: 1;
            transform: scale(1);
        }

        .names-main {
            font-family: 'Alex Brush', cursive;
            font-size: 3.8rem;
            color: #c47b62;
            margin-bottom: 2px;
            line-height: 1.1;
        }

        .getting-married {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 5px;
            color: #777;
            text-transform: uppercase;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .details-box {
            border: 1px dashed #d4af37;
            background: #fffdf9;
            border-radius: 16px;
            padding: 20px;
            margin: 20px 0;
            line-height: 2.2;
            font-size: 1.05rem;
            font-family: 'Cairo', sans-serif;
            direction: rtl;
            text-align: right;
            box-shadow: inset 0 0 10px rgba(212, 175, 55, 0.05);
        }

        .details-box p {
            margin: 6px 0;
            color: #444;
        }

        .details-box strong {
            color: #b8860b;
        }

        .countdown-title {
            font-size: 0.95rem;
            color: #777;
            margin-bottom: 14px;
            font-weight: 600;
            font-family: 'Cairo', sans-serif;
        }

        .countdown-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .time-box {
            border: 1px solid #eadca6;
            background: #ffffff;
            border-radius: 12px;
            padding: 10px 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }

        .time-box .number {
            font-size: 1.3rem;
            font-weight: 700;
            color: #b8860b;
            display: block;
        }

        .time-box .label {
            font-size: 0.75rem;
            color: #888;
            margin-top: 4px;
            display: block;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- الصوت -->
    <audio id="bg-music" loop preload="auto">
        <source src="AUDIO-2026-08-28-12-05-50.m4a" type="audio/mp4">
        <source src="AUDIO-2026-08-28-12-05-50.m4a" type="audio/x-m4a">
    </audio>

    <!-- زرار التحكم بالصوت -->
    <button class="music-btn" id="music-toggle" onclick="toggleMusic()">
        🎵 تشغيل الموسيقى
    </button>

    <!-- 1. الشاشة الأولى: غلاف الدعوة -->
    <div id="cover-screen">
        <div class="cover-frame">
            <h1 class="cover-title">دعوة</h1>
        </div>
    </div>

    <!-- 2. الشاشة الثانية: التصميم الوردي والأصداف بنفس الصورة -->
    <div id="floral-screen">
        <!-- الرموز الورقية والتجميلية المشابهة للصورة -->
        <div class="floral-element f-top-left-1">🌸</div>
        <div class="floral-element f-top-left-2">🐚</div>
        <div class="floral-element f-top-right">🌺</div>
        <div class="floral-element f-mid-left">🌸</div>
        <div class="floral-element f-mid-right-1">🐚</div>
        <div class="floral-element f-mid-right-2">⭐</div>
        <div class="floral-element f-bottom-left">🌸</div>
        <div class="floral-element f-bottom-right-1">🐚</div>
        <div class="floral-element f-bottom-right-2">🌺</div>

        <div class="floral-content">
            <h1 class="floral-names">Isaac & Eriny</h1>
            <p class="floral-subtitle">ARE GETTING MARRIED</p>
            <div class="floral-line"></div>
        </div>
    </div>

    <!-- 3. الشاشة الثالثة: صورة العروسين -->
    <div id="photo-screen">
        <img src="52bf4d92-04d8-47d0-860c-c82991e1cb71.jpeg" alt="Isaac & Eriny">
    </div>

    <!-- 4. الشاشة رابعة: الدعوة التفصيلية -->
    <div class="card" id="main-card">
        <h1 class="names-main">Isaac & Eriny</h1>
        <div class="getting-married">Are Getting Married</div>

        <div class="details-box">
            <p>⛪ <strong>الصلاة:</strong> كنيسة الملاك والبابا كيرلس</p>
            <p>👑 <strong>الحفل:</strong> قاعة رويال بملوي</p>
            <p>📅 <strong>التاريخ:</strong> الثلاثاء 8 سبتمبر 2026</p>
        </div>

        <div class="countdown-title">المتبقي على اليوم الموعود</div>

        <div class="countdown-container">
            <div class="time-box">
                <span class="number" id="days">00</span>
                <span class="label">يوم</span>
            </div>
            <div class="time-box">
                <span class="number" id="hours">00</span>
                <span class="label">ساعة</span>
            </div>
            <div class="time-box">
                <span class="number" id="minutes">00</span>
                <span class="label">دقيقة</span>
            </div>
            <div class="time-box">
                <span class="number" id="seconds">00</span>
                <span class="label">ثانية</span>
            </div>
        </div>
    </div>

    <script>
        const audio = document.getElementById('bg-music');
        const musicBtn = document.getElementById('music-toggle');

        function toggleMusic() {
            if (audio.paused) {
                audio.play().then(() => {
                    musicBtn.innerHTML = "🔊 كتم الصوت";
                }).catch(err => console.log(err));
            } else {
                audio.pause();
                musicBtn.innerHTML = "🎵 تشغيل الموسيقى";
            }
        }

        document.body.addEventListener('click', function() {
            if (audio.paused) {
                audio.play().then(() => {
                    musicBtn.innerHTML = "🔊 كتم الصوت";
                }).catch(err => console.log(err));
            }
        }, { once: true });

        const coverScreen = document.getElementById('cover-screen');
        const floralScreen = document.getElementById('floral-screen');
        const photoScreen = document.getElementById('photo-screen');
        const mainCard = document.getElementById('main-card');

        // تسلسل الشاشات: 3s غلاف ➔ 3s تصميم الورود والأصداف ➔ 3s صورة العروسين ➔ الدعوة
        setTimeout(function() {
            coverScreen.style.opacity = '0';

            setTimeout(function() {
                coverScreen.style.display = 'none';
                floralScreen.style.display = 'flex';
                setTimeout(() => { floralScreen.style.opacity = '1'; }, 50);

                setTimeout(function() {
                    floralScreen.style.opacity = '0';

                    setTimeout(function() {
                        floralScreen.style.display = 'none';
                        photoScreen.style.display = 'flex';
                        setTimeout(() => { photoScreen.style.opacity = '1'; }, 50);

                        setTimeout(function() {
                            photoScreen.style.opacity = '0';

                            setTimeout(function() {
                                photoScreen.style.display = 'none';
                                mainCard.classList.add('show');
                            }, 1000);

                        }, 3000);

                    }, 1000);

                }, 3000);

            }, 1000);

        }, 3000);

        // العداد التنازلي
        const weddingDate = new Date("September 8, 2026 18:00:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = weddingDate - now;

            if (difference > 0) {
                const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((difference % (1000 * 60)) / 1000);

                document.getElementById("days").innerText = days;
                document.getElementById("hours").innerText = hours;
                document.getElementById("minutes").innerText = minutes;
                document.getElementById("seconds").innerText = seconds;
            } else {
                document.querySelector(".countdown-title").innerText = "Congratulations!";
                document.querySelector(".countdown-container").style.display = "none";
            }
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
