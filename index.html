
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة زفاف إسحاق وإريني</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #d4af37;
            --primary-dark: #aa8625;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-light: #f8fafc;
            --text-gold: #f3e8c8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 24px;
            padding: 40px 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            animation: fadeIn 1.2s ease-in-out;
        }

        .header-title {
            font-family: 'Amiri', serif;
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .sub-title {
            font-size: 1.1rem;
            color: var(--text-gold);
            margin-bottom: 30px;
            font-weight: 400;
        }

        .names {
            font-family: 'Amiri', serif;
            font-size: 3rem;
            font-weight: 700;
            color: #ffffff;
            margin: 20px 0;
            line-height: 1.4;
        }

        .names span {
            color: var(--primary);
            display: inline-block;
            margin: 0 10px;
        }

        .countdown-title {
            margin-top: 30px;
            font-size: 1rem;
            letter-spacing: 1px;
            color: #94a3b8;
        }

        .timer {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0 35px 0;
            direction: ltr;
        }

        .time-box {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(212, 175, 55, 0.2);
            padding: 15px 10px;
            border-radius: 12px;
            min-width: 70px;
            flex: 1;
        }

        .time-box .number {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
            display: block;
        }

        .time-box .label {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 5px;
        }

        .details {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 25px;
            margin-top: 25px;
        }

        .detail-item {
            font-size: 1.1rem;
            margin: 10px 0;
            color: var(--text-gold);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .header-title { font-size: 2rem; }
            .names { font-size: 2.2rem; }
            .time-box { min-width: 60px; padding: 10px 5px; }
            .time-box .number { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2 class="header-title">دعوة زفاف</h2>
        <p class="sub-title">يتشرفان بدعوتكم لحضور حفل زفافهما المبارك</p>

        <div class="names">
            إسحاق <span>&</span> إريني
        </div>

        <div class="countdown-title">المتبقي على اليوم الموعود</div>

        <div class="timer">
            <div class="time-box">
                <span class="number" id="days">00</span>
                <span class="label">يوم</span>
            </div>
            <div class="time-box">
                <span class="number" id="hours">00</span>
                <span class="label">ساعة</span>
            </div>
            <div class="time-box">
                <span class="number" id="minutes">00</span>
                <span class="label">دقيقة</span>
            </div>
            <div class="time-box">
                <span class="number" id="seconds">00</span>
                <span class="label">ثانية</span>
            </div>
        </div>

        <div class="details">
            <div class="detail-item">✨ حفل الزفاف المبارك ✨</div>
        </div>
    </div>

    <script>
        // ضبط تاريخ المناسبة (قم بتعديل التاريخ والوقت هنا حسب رغبتك)
        const targetDate = new Date("2026-10-15T18:00:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference > 0) {
                const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((difference % (1000 * 60)) / 1000);

                document.getElementById("days").innerText = days < 10 ? "0" + days : days;
                document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
                document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
                document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;
            } else {
                document.getElementById("days").innerText = "00";
                document.getElementById("hours").innerText = "00";
                document.getElementById("minutes").innerText = "00";
                document.getElementById("seconds").innerText = "00";
            }
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
